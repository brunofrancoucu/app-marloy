services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: gestion_comercial
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app_secret
    volumes:
      # Persists data between container restarts
      - mysql_data:/var/lib/mysql
      # Maps your local SQL scripts into the container's init directory
      - ./docker:/docker-entrypoint-initdb.d:ro
    ports:
      - '3306:3306'

  backend:
    build:
      context: ./backend
    environment:
      # Matches the service name 'database' to resolve the host connection
      DB_HOST: database
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: gestion_comercial
      ENVIRONMENT: development
      PYTHONPATH: /mysql-orm-lite
    volumes:
      # Mounts your local code to the container for live development
      - ./backend:/app
      # Maps your local package directly into the container's root
      - ../mysql-orm-lite:/mysql-orm-lite
    ports:
      - '8000:8000'
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 38400 # 12 horas

volumes:
  mysql_data:
